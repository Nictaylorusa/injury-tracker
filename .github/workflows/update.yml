name: Update injury data
on:
  schedule:
    - cron: "17 8 * * *"        # once a day (history); Right now has its own 15-minute job
  workflow_dispatch: {}          # lets you press "Run workflow" by hand
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - run: python build.py
      - name: Save changes
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Update injury data" && git pull --rebase -q && git push; fi
