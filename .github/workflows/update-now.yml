name: Update Right now (every 15 minutes)
on:
  schedule:
    - cron: "*/15 * * * *"       # every 15 minutes (GitHub may start a run a few minutes late)
  workflow_dispatch: {}          # lets you press "Run workflow" by hand
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  now:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-now.txt
      - run: pip install -r requirements-now.txt
      - run: python fetch_now.py
      - name: Save changes
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Update Right now" && git pull --rebase -q && git push; fi
